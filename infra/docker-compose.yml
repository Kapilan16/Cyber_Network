services:
  # ── PostgreSQL 16 + pgvector extension ────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB:       cyberdb
      POSTGRES_USER:     cyberuser
      POSTGRES_PASSWORD: cyberpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberuser -d cyberdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # Override host so backend reaches postgres container by service name
      DATABASE_URL: postgresql+psycopg2://cyberuser:cyberpass@postgres:5432/cyberdb
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      # Hot-reload: mount source in dev (remove in production)
      - ../backend/app:/app/app:ro

  # ── Frontend (React + Vite via Nginx) ─────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
